<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Ekonomi Digital</title>
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #64748b;
            --bg: #f8fafc;
            --card: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: var(--card);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
        }

        h2 { text-align: center; color: var(--primary); margin-bottom: 1.5rem; }

        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 5px; font-size: 0.9rem; font-weight: 600; }
        
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input:focus { outline: none; border-color: var(--primary); }

        button {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover { background: #1d4ed8; }

        .result-box {
            margin-top: 2rem;
            padding: 1rem;
            background: #eff6ff;
            border-left: 5px solid var(--primary);
            border-radius: 4px;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .value { font-weight: bold; color: #1e40af; }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 Digital Econ Calc</h2>
    <form action="/calculate" method="POST">
        <div class="form-group">
            <label>Total Biaya Marketing (Rp)</label>
            <input type="number" name="cost" placeholder="Contoh: 5000000" required>
        </div>
        <div class="form-group">
            <label>Jumlah User Baru Didapat</label>
            <input type="number" name="customers" placeholder="Contoh: 100" required>
        </div>
        <div class="form-group">
            <label>Rata-rata Belanja per User (Rp)</label>
            <input type="number" name="purchase" placeholder="Contoh: 200000" required>
        </div>
        <div class="form-group">
            <label>Retention Rate (%)</label>
            <input type="number" name="retention" placeholder="0-100" required>
        </div>
        <button type="submit">Hitung Performa</button>
    </form>

    {% if submitted %}
    <div class="result-box">
        <div class="result-item">
            <span>CAC (Biaya Akuisisi):</span>
            <span class="value">Rp {{ cac }}</span>
        </div>
        <div class="result-item">
            <span>LTV (Nilai Pelanggan):</span>
            <span class="value">Rp {{ ltv }}</span>
        </div>
        <hr>
        <div class="result-item">
            <span>Rasio LTV/CAC:</span>
            <span class="value">{{ ratio }}x</span>
        </div>
        <p style="font-size: 0.8rem; color: #666;">
            *Target ideal startup adalah rasio > 3x.
        </p>
    </div>
    {% endif %}
</div>

</body>
</html>
